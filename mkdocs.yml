site_name: 行列を使わない Transformer 入門
site_description: 行列計算ゼロの Scala プログラムとして小さな言語モデルを組み立てながら、Transformer を理解する
site_url: https://kmizu.github.io/no-matrix-transformer/
repo_url: https://github.com/kmizu/no-matrix-transformer
repo_name: kmizu/no-matrix-transformer
edit_uri: edit/main/docs/site/
copyright: Copyright &copy; 2026 Kota Mizushima

docs_dir: target/mdoc
site_dir: target/site
exclude_docs: |
  snippets/

theme:
  name: material
  custom_dir: overrides
  language: ja
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ
  features:
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - はじめに: index.md
  - 第1章 準備: 01-setup.md
  - 第2章 ベクトルは数の並び: 02-vec.md
  - 第3章 ニューロンと Dense: 03-dense.md
  - 第4章 トークンと埋め込み: 04-embedding.md
  - 第5章 位置を知る: 05-position.md
  - 第6章 注意: 06-attention.md
  - 第7章 複数の視点: 07-multihead.md
  - 第8章 FeedForward・残差・LayerNorm: 08-block.md
  - 第9章 ブロックを積む: 09-transformer.md
  - 第10章 損失: 10-loss.md
  - 第11章 学習（微分なし）: 11-learning.md
  - 第12章 文章を生成する: 12-generate.md
  - 第13章 実際に学習させる: 13-experiment.md
  - 第14章 行列と微分はどこにいたのか: 14-epilogue.md
  - 付録 傾きを測ってつなぐ: 15-backprop.md
  - 付録B さらに速くするには: 16-faster.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/nomatrix.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: ja
